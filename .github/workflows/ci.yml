# Builds and tests on Linux, macOS and Windows for every push and pull request.
# publish.yml also calls this workflow (workflow_call) before it stages a release.
name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 24: what publish.yml releases with. 20: the engines minimum's major
        # (package.json ">=20.3"), at its latest release. Exact 20.3.0 is not
        # used: its test runner intermittently never exits after
        # test/reqlog.test.mjs passes (not reproducible on 20.20).
        node: ["24", "20"]
    steps:
      # Keep LF on Windows so the committed dist/ compares byte for byte with a
      # fresh build (.gitattributes also pins eol=lf).
      - name: Disable autocrlf
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Verify committed dist matches source
        shell: bash
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist/ is out of date with src/. Run npm run build and commit dist."
            git status --porcelain dist
            git diff --stat dist
            exit 1
          fi

      - name: Test (NO_COLOR)
        run: npm test
        env:
          NO_COLOR: "1"

      - name: Test (colour)
        run: npm test
        env:
          FORCE_COLOR: "1"
          TERM: xterm-256color
