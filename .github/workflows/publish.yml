# Publishes a release tag to npm via Trusted Publishing (OIDC): no npm token, passkey
# or staging. The trusted publisher on npmjs.com is bound to this file name
# (publish.yml) and the GitHub environment `npm`, so do not rename this file or the
# environment. The `npm` environment requires a maintainer's approval (one tap in the
# GitHub app) and only accepts v* tags.
#
# Started by release.yml (workflow_dispatch on the tag it just created) or by pushing
# a vX.Y.Z tag (publish.sh --local, which publishes first, so this run only tests it).
name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.published.outputs.skip }}
    steps:
      - name: Require a release tag
        run: |
          if ! [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Run this on a vX.Y.Z tag, not $GITHUB_REF"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # `./publish.sh --local` publishes from a maintainer's machine before it pushes
      # the tag; CI still tests the tag, but there is nothing to publish (or approve).
      - name: Skip publishing if this version is already on npm
        id: published
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Compare the output: some npm versions exit 0 with no output for a missing version.
          if [ "$(npm view "claude-code-infinite@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "::notice::claude-code-infinite@$VERSION is already on npm; not publishing."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  # The full cross-platform CI (ci.yml) must pass before anything is published.
  ci:
    needs: check
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: [check, ci]
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/claude-code-infinite
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. Pinned so a new npm release cannot
      # run in a job that holds the OIDC token.
      - name: Install npm 11.21.0
        run: |
          npm install -g --ignore-scripts npm@11.21.0
          echo "npm $(npm --version)"

      # No install scripts: this job can mint the publish credential.
      - run: npm ci --ignore-scripts

      - name: Verify committed dist matches source
        run: |
          npm run build
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist/ is out of date with src/. Run npm run build and commit dist."
            git status --porcelain dist
            exit 1
          fi

      # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token for a short-lived
      # credential. Provenance is automatic under trusted publishing for a public
      # repo; --provenance makes that explicit.
      - name: Publish
        run: npm publish --provenance --access public

      - name: Summary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "::notice::Published claude-code-infinite@$VERSION"
          {
            echo "## Published claude-code-infinite@$VERSION"
            echo
            echo "https://www.npmjs.com/package/claude-code-infinite/v/$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
